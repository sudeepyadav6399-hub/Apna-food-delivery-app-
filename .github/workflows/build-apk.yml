name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          cordova create myapp com.apnafood.app "Apna Food"
          cd myapp
          rm -rf www/*
          cp -r ../*.html ../*.js ../*.css ../*.svg ../*.json www/ 2>/dev/null || true
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apna-food-apk
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
